<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: sans-serif; }
</style>
</head>
<body>
<div id="container" style="position:relative; width: 440px; height: 220px; background: #eee;">
  <div id="test_div" style="position:absolute;">Extremely long product name that should shrink to fit the box precisely without wrapping if possible</div>
</div>
<script>
function autoFitTextElement(div, el) {
    try {
        if (!div) return;
        const text = div.innerText || div.textContent || '';
        if (!text.trim()) return;

        const ew = parseFloat(el.w);
        const eh = parseFloat(el.h);
        const ex = parseFloat(el.x) || 0;
        const ey = parseFloat(el.y) || 0;
        const containerW = window.stickerLayout?.width || 440;
        
        const targetW = (ew > 0) ? ew : Math.max(50, containerW - ex - 5);
        const baseFontSize = parseInt(el.fontSize, 10) || 14;
        const targetH = (eh > 0) ? eh : Math.round(baseFontSize * 1.4) || 24;
        
        const minFontSize = 6;
        const minScale = minFontSize / baseFontSize;
        const isMultiline = !!el.multiline;

        // Clone for safe measurement outside of any display:none or scaled parents
        const clone = div.cloneNode(true);
        clone.style.position = 'absolute';
        clone.style.visibility = 'hidden';
        clone.style.left = '-9999px';
        clone.style.top = '0px';
        clone.style.width = 'auto';  
        clone.style.height = 'auto';
        clone.style.overflow = 'visible';
        clone.style.whiteSpace = 'nowrap';
        clone.style.display = 'inline-block';
        clone.style.transform = 'none';
        clone.style.fontSize = baseFontSize + 'px';
        document.body.appendChild(clone);

        const rawWidth = clone.scrollWidth;

        let finalWhiteSpace = 'nowrap';
        let finalWidth = targetW;
        let finalHeight = targetH;
        let scale = 1;

        if (rawWidth > targetW) {
            let idealScale = targetW / rawWidth;

            if (idealScale >= minScale || !isMultiline) {
                finalWhiteSpace = 'nowrap';
                scale = idealScale;
                finalWidth = targetW / scale; 
                finalHeight = targetH / scale; 
            } else {
                finalWhiteSpace = 'pre-wrap';
                clone.style.whiteSpace = 'pre-wrap';
                clone.style.wordBreak = 'break-word';
                clone.style.overflowWrap = 'anywhere';
                
                const wrapWidth = targetW / minScale;
                clone.style.width = wrapWidth + 'px'; 
                clone.style.height = 'auto';
                
                const wrappedHeight = clone.scrollHeight;
                
                if (wrappedHeight * minScale > targetH) {
                    scale = targetH / wrappedHeight;
                    finalWidth = wrapWidth; 
                    finalHeight = wrappedHeight;
                } else {
                    scale = minScale;
                    finalWidth = wrapWidth;
                    finalHeight = targetH / scale;
                }
            }
        } else {
            finalWhiteSpace = 'nowrap';
            finalWidth = targetW;
            finalHeight = targetH;
            scale = 1;
        }
        
        document.body.removeChild(clone);

        div.style.fontSize = baseFontSize + 'px';
        div.style.whiteSpace = finalWhiteSpace;
        div.style.wordBreak = (finalWhiteSpace === 'pre-wrap') ? 'break-word' : 'normal';
        div.style.overflowWrap = (finalWhiteSpace === 'pre-wrap') ? 'anywhere' : 'normal';
        div.style.width = finalWidth + 'px';
        div.style.height = finalHeight + 'px';
        div.style.display = 'flex';
        div.style.alignItems = 'center';
        div.style.justifyContent = (finalWhiteSpace === 'pre-wrap') ? 'flex-start' : 'center';
        div.style.textAlign = (finalWhiteSpace === 'pre-wrap') ? 'left' : 'center';
        div.style.overflow = 'hidden';

        if (scale < 0.999) {
            div.style.transform = `scale(${scale})`;
            div.style.transformOrigin = 'left top';
        } else {
            div.style.transform = 'none';
        }

    } catch(e) { console.error(e); }
}

const div = document.getElementById('test_div');
autoFitTextElement(div, {
    w: 100,
    h: 30,
    x: 10,
    y: 10,
    fontSize: 20,
    multiline: false
});
console.log("Done");
</script>
</body>
</html>
